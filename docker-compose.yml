services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro
      POSTGRES_DB: retrocasino
    ports:
      # Host 5432/5433 are taken by native Postgres services; use 55432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrocasino"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
